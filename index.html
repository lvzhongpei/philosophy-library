<!DOCTYPE html>
<html lang="zh-CN">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>哲学图书馆 · 深空档案</title>
<meta name="description" content="二十八位哲学家的星图：从老子、孔子、韩非到休谟、海德格尔、维特根斯坦。生平、流派、观点、著作、名言，以及五十六个可以被操作的思想实验。">
<meta name="theme-color" content="#05070d">
<meta property="og:title" content="哲学图书馆 · 深空档案">
<meta property="og:description" content="把二十八位哲学家的思想做成可以操作的星空。">
<meta property="og:type" content="website">
<link rel="icon" href="data:image/svg+xml,%3Csvg xmlns='http://www.w3.org/2000/svg' viewBox='0 0 32 32'%3E%3Ccircle cx='16' cy='16' r='3' fill='%234fd1c5'/%3E%3Ccircle cx='16' cy='16' r='11' fill='none' stroke='%234fd1c5' stroke-opacity='.45' stroke-width='1'/%3E%3C/svg%3E">
<link rel="stylesheet" href="css/base.css">
<link rel="stylesheet" href="css/star.css">
</head>
<body class="page-home">

<canvas id="stars" aria-hidden="true"></canvas>

<header class="topbar">
  <a class="brand" href="index.html">
    <span class="brand-mark" aria-hidden="true">✦</span>
    <span class="brand-cn">哲学图书馆</span>
    <span class="brand-en">PHILOSOPHIA · DEEP FIELD</span>
  </a>
  <nav class="viewswitch" role="tablist" aria-label="视图切换">
    <a class="navlink" href="graph.html" style="padding:6px 12px;border-right:1px solid var(--hair)">图谱</a>
    <a class="navlink" href="dialogue.html" style="padding:6px 12px;border-right:1px solid var(--hair)">对话</a>
    <button data-view="map" class="is-on" role="tab" aria-selected="true">星图</button>
    <button data-view="list" role="tab" aria-selected="false">名录</button>
  </nav>
</header>

<main>
  <section id="view-map" class="view is-on" aria-label="星图">
    <div class="map-wrap" id="mapWrap">
      <canvas id="mapCanvas" aria-hidden="true"></canvas>
      <div class="map-labels" id="mapLabels"></div>
      <div class="map-intro">
        <h1>二十八人星图</h1>
        <p>点击任一颗星，进入一个人的一生。</p>
        <span class="mi-mono">TWENTY-EIGHT PHILOSOPHERS · 2400 YEARS</span>
      </div>
    </div>
    <div class="era-bar">
      <span class="era-label">年代</span>
      <input id="eraSlider" type="range" min="-600" max="1960" value="1960" step="1" aria-label="按出生年代筛选">
      <output class="era-out" id="eraOut">— 全部 —</output>
    </div>
  </section>

  <section id="view-list" class="view" aria-label="名录">
    <p class="hint-line" style="padding-top:28px">
      <input id="search" type="search" placeholder="搜索 名字 / 流派 / 观点 / 书名 / 名言" aria-label="搜索"
        style="width:100%;max-width:520px;background:transparent;border:0;border-bottom:1px solid var(--hair-strong);color:var(--ink);font-family:var(--mono);font-size:12px;letter-spacing:.12em;padding:10px 2px;outline:none">
    </p>
    <ul class="cards" id="cards"></ul>
    <p id="noResult" style="display:none;text-align:center;font-family:var(--mono);font-size:11px;letter-spacing:.18em;color:var(--faint);padding:40px 0 20px">
      没有匹配的条目 · 换个词试试
    </p>
  </section>
</main>

<footer class="foot">
  <span>哲学图书馆 · 二十八人星图 · v7</span>
  <span>内容为编译与转述，引文均标注出处；原文拼写以通行校勘本为准。</span>
  <a href="https://github.com/lvzhongpei/philosophy-library" target="_blank" rel="noopener">GITHUB ↗</a>
</footer>

<script src="js/starfield.js"></script>
<script src="js/starmap.js"></script>
</body>
</html>
